# Tema claro "folha + verde" do cartão-resposta -- fundo branco/cinza
# claro com texto quase preto (validado antes só na página beta "Prova
# com enunciado", promovido pro app inteiro a pedido do usuário: "a
# fonte assim de cor deixa padronizada branco... que nem você fez na
# prova"). primaryColor/greenColor usam um verde mais escuro que o
# neon original (#39FF14) de propósito -- neon sobre branco falha
# contraste de texto (WCAG); #39FF14 continua vivo em glow/destaque
# pontual via core/ui_theme.py, só não como cor de texto/borda sólida.
# Ver core/ui_theme.py pro CSS complementar (esconde o rodapé "Made
# with Streamlit", estiliza botões/cards/bolhas de resposta, mantém a
# gaveta de navegação no visual escuro original) que o config sozinho
# não alcança.

[theme]
base = "light"

primaryColor = "#15803D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAFAFA"
textColor = "#1A1A1A"
borderColor = "#DDDDDD"
greenColor = "#15803D"

showWidgetBorder = true
showSidebarBorder = true

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"

baseFontWeight = 400
headingFontWeights = 700
metricValueFontSize = "2.25rem"
metricValueFontWeight = 700

baseRadius = "0.6rem"
buttonRadius = "0.5rem"
