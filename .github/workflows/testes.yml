# Roda a suíte de testes e o lint a cada push/PR. Não precisa de enem.db:
# os testes do core criam banco temporário (ver core/CLAUDE.md).
name: testes

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../requirements.txt httpx ruff
      - name: Lint (erros reais, não estilo)
        run: ruff check . --select F,E9
      - name: Testes
        run: python -m unittest discover -p "test_*.py"

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
